location = /heartnote-capture {
    return 308 https://$host/heartnote-capture/;
}

location /heartnote-capture/ {
    client_max_body_size 33m;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /heartnote-capture;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # Request paths can contain search terms and capture IDs. Keep them out of
    # the shared Nginx access log; the app logs only HTTP method and status.
    access_log off;
}
