# Include inside the existing HTTPS server block.
location = /mnote-transcript {
    return 308 /mnote-transcript/;
}

location = /mnote-transcript/api/transcripts/jobs {
    include /etc/nginx/snippets/mnote-transcript-public-proxy.conf;
    limit_req zone=mnote_transcript_public_posts burst=5 nodelay;
}

location /mnote-transcript/api/transcripts/ {
    include /etc/nginx/snippets/mnote-transcript-public-proxy.conf;
    limit_req zone=mnote_transcript_public_reads burst=30 nodelay;
}

location @mnote_transcript_public_busy {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"error":{"code":"ingress_limited","message":"请求过于频繁，请等待 30 秒后重试。"}}';
}

location @mnote_transcript_public_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 413 '{"error":{"code":"body_too_large","message":"链接和声明内容过长，请缩短后再提交。"}}';
}

location /mnote-transcript/ {
    alias /var/www/mnote-transcript-current/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}
