# Install under /etc/nginx/conf.d/ (http context), not inside a server block.
# This server is behind sslh; peer addresses may aggregate to loopback. These
# are conservative ingress limits, not claims of verified end-user IP identity.
limit_req_zone $binary_remote_addr zone=mnote_transcript_public_reads:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mnote_transcript_public_posts:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=mnote_transcript_public_connections:1m;
