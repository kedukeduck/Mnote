# Shared settings for both public API locations. Keep client credentials out of
# the trusted core; the gateway supplies its own Bearer and derived owner.
client_max_body_size 16k;
client_body_timeout 10s;
proxy_pass http://127.0.0.1:8792;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Cookie $http_cookie;
proxy_set_header Origin $http_origin;
proxy_set_header Authorization "";
proxy_set_header X-Owner-Id "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 10s;
limit_conn mnote_transcript_public_connections 16;
limit_conn_status 429;
limit_req_status 429;
error_page 413 = @mnote_transcript_public_too_large;
error_page 429 = @mnote_transcript_public_busy;
access_log off;
# Suppress path/query-bearing error details only for this dedicated route.
error_log /dev/null crit;
